server:
  name: opspilot
  transport: stdio
  log_channel: stderr_only
  protocol_channel: stdout_only

tools:
  - name: list_alerts
    description: Lista alertas operacionais por estado.
    input:
      type: object
      required: []
      properties:
        status:
          type: string
          enum: [firing, resolved, all]
          default: firing
    output:
      type: array
      items:
        $ref: '#/components/schemas/Alert'

  - name: open_incident
    description: Abre um novo incidente operacional.
    input:
      type: object
      required: [title, service, severity]
      properties:
        title:
          type: string
          minLength: 1
        service:
          type: string
          minLength: 1
        severity:
          type: string
          enum: [low, medium, high, critical]
        summary:
          type: string
          minLength: 1
          nullable: true
    output:
      $ref: '#/components/schemas/Incident'

  - name: resolve_incident
    description: Resolve um incidente existente.
    input:
      type: object
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
    output:
      oneOf:
        - $ref: '#/components/schemas/Incident'
        - type: 'null'

components:
  schemas:
    Alert:
      type: object
      required: [id, title, service, severity, status, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        service: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [firing, resolved] }
        createdAt: { type: string }
        resolvedAt:
          type: [string, 'null']

    Incident:
      type: object
      required: [id, title, service, severity, status, openedAt]
      properties:
        id: { type: string }
        title: { type: string }
        service: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, resolved] }
        openedAt: { type: string }
        resolvedAt:
          type: [string, 'null']
        summary:
          type: [string, 'null']

error_handling:
  invalid_input: Retornar erro explícito de validação sem fallback silencioso.
  invalid_state: Retornar erro explícito para incidente inexistente ou estado incompatível.
  diagnostics: Mensagens de diagnóstico devem ser enviadas apenas para stderr.
