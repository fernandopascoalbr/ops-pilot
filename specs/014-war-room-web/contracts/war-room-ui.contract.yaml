openapi: 3.0.3
info:
  title: War Room UI Contract
  version: 1.0.0
  description: Contract used by the browser app to interact with the OpsPilot backend and render a reviewable war room state.
paths:
  /chat:
    post:
      summary: Send a message to the incident workflow and get an operational answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Success response with operational answer and trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Invalid body or invalid request payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '422':
          description: Requested strategy or action is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '504':
          description: The server took too long to respond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
components:
  schemas:
    ChatRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          description: User prompt for the incident workflow.
        strategy:
          type: string
          nullable: true
          description: Optional named strategy selection.
        reflect:
          type: boolean
          default: false
          description: Whether the backend should append a critique event.
        conversationId:
          type: string
          nullable: true
          description: Optional reusable thread identifier.
        userId:
          type: string
          nullable: true
          description: Optional user-scoped context.
    ChatResponse:
      type: object
      required:
        - answer
        - trace
        - metrics
      properties:
        answer:
          type: string
          description: Final operational answer for the end user.
        trace:
          type: array
          description: Trace steps of the reasoning flow.
          items:
            $ref: '#/components/schemas/TraceStep'
        metrics:
          $ref: '#/components/schemas/ExecutionMetrics'
    TraceStep:
      type: object
      required:
        - id
        - message
        - type
      properties:
        id:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [info, action, decision, critique, result]
        timestamp:
          type: string
          format: date-time
          nullable: true
    ExecutionMetrics:
      type: object
      required:
        - totalTimeMs
      properties:
        totalTimeMs:
          type: integer
          minimum: 0
        promptTokens:
          type: integer
          minimum: 0
          nullable: true
        completionTokens:
          type: integer
          minimum: 0
          nullable: true
        costUsd:
          type: number
          nullable: true
    ValidationError:
      type: object
      required:
        - issues
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    Issue:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: array
          items:
            type: string
