name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build and upload Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web application
        run: npm run build
        working-directory: web

      - name: Guard build artifact before upload
        run: |
          if [ ! -d "web/dist" ] || [ ! -f "web/dist/index.html" ]; then
            echo "::error::Expected build artifact in web/dist was not found."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs:
      - build-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Guard uploaded Pages artifact availability
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/github-pages-artifact

      - name: Validate downloaded Pages artifact
        run: |
          if [ ! -s "/tmp/github-pages-artifact/artifact.tar" ]; then
            echo "::error::Pages artifact is missing or invalid."
            exit 1
          fi

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
